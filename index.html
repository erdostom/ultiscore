<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f33" />
    <meta name="description" content="Ulti elszámoló játékpontokkal, egyéni pontokkal és állítható szorzóval." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>UltiScore · Ulti elszámoló</title>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="masthead"><div class="shell topbar">
      <div class="brand"><img src="./favicon.svg" width="34" height="34" alt="" />UltiScore</div>
    </div></header>
    <main class="shell">
      <section class="banner" aria-labelledby="title">
        <h1 id="title">Ulti elszámoló</h1>
      </section>

      <div class="dashboard">
        <section class="panel sheet" aria-labelledby="sheet-title">
          <div class="panel-head"><h2 id="sheet-title">Pontozólap</h2><span id="player-count" class="counter"></span></div>
          <div class="entry-grid col-labels" aria-hidden="true"><span>Játékos</span><span>Játékpont</span><span>Egyéni pont</span></div>
          <div id="entries"></div>
          <div id="balance-box" class="balance-box" hidden>
            <span id="balance-icon" aria-hidden="true"></span><span class="balance-copy">Egyéni pontok összege</span>
            <strong id="balance">0</strong>
          </div>
          <p id="balance-hint" class="hint" hidden></p>
          <p id="entry-error" class="error" hidden></p>
        </section>

        <section class="panel results" aria-labelledby="result-title">
          <div class="panel-head"><h2 id="result-title">Végeredmény</h2><span class="result-mark" aria-hidden="true"></span></div>
          <table id="steps" class="steps" hidden>
            <caption>Szorzás előtti pontok</caption>
            <thead><tr><th scope="col">Játékos</th><th scope="col">Különbség</th><th scope="col">Egyéni pont</th><th scope="col">Részösszeg</th></tr></thead>
            <tbody></tbody>
          </table>
          <p id="steps-empty" class="empty-state">A számításhoz adj meg játékpontot.</p>
          <details id="pairs" hidden>
            <summary>Páronkénti különbségek</summary>
            <dl id="pair-equations"></dl>
          </details>
          <div class="settings">
            <label for="multiplier">Szorzó</label>
            <span class="select-wrap"><select id="multiplier" aria-controls="custom-setting"></select></span>
            <div id="custom-setting" hidden>
              <label for="custom">Egyéni szorzó</label>
              <input id="custom" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-describedby="custom-error" />
              <p id="custom-error" class="error" hidden>Adj meg egy számot szorzóként.</p>
            </div>
          </div>
          <ul id="totals" class="totals"></ul>
          <div class="result-foot" aria-hidden="true"><span></span><i></i><span></span></div>
        </section>
      </div>
      <p id="notice" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <footer class="shell footer"><span class="footer-brand">UltiScore</span><span>Készítette <a href="https://github.com/erdostom">erdostom</a></span></footer>
    <noscript>A számításhoz engedélyezd a JavaScriptet.</noscript>
  </body>
</html>
